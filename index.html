<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travels — Sankha Cooray</title>
  <meta name="description" content="An interactive map of the countries Sankha Cooray has visited — shaded by how often." />
  <meta name="theme-color" content="#0b0d12" />

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Travels — Sankha Cooray" />
  <meta property="og:description" content="An interactive map of the countries I've visited, shaded by how often." />
  <meta property="og:url" content="https://travel.sankhacooray.com/" />
  <meta property="og:image" content="https://travel.sankhacooray.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Travels — Sankha Cooray" />
  <meta name="twitter:description" content="An interactive map of the countries I've visited, shaded by how often." />
  <meta name="twitter:image" content="https://travel.sankhacooray.com/og-image.png" />

  <link rel="canonical" href="https://travel.sankhacooray.com/" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="vendor/jsvectormap.min.css" />
  <style>
    :root {
      --bg:        #0b0d12;
      --bg-2:      #0f131b;
      --surface:   #141925;
      --surface-2: #1a2030;
      --line:      #242c3b;
      --text:      #e9ecf2;
      --text-dim:  #aab2c2;
      --text-mute: #6c7689;
      --accent:    #34d6a5;
      --accent-2:  #5b8cff;
      --on-accent: #06120d;
      --map-empty: #222b3d;  /* not-visited country fill — faint land on the dark sea */
      --map-stroke:#3a465f;  /* faint country borders */
      --danger:    #ff6b6b;
      --radius:    16px;
      --shadow:    0 16px 40px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(91, 140, 255, 0.10), transparent 60%),
        radial-gradient(900px 500px at 0% 110%, rgba(52, 214, 165, 0.08), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;              /* non-scroll app experience */
    }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    /* ---- Header (app bar) ---- */
    header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 0 12px;
    }
    .app-title {
      margin: 0;
      font-size: clamp(1.25rem, 3.4vw, 1.7rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .app-title .grad {
      background: linear-gradient(92deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .brand .dot { color: var(--accent); }
    .brand a { color: var(--text); text-decoration: none; }
    .brand .sub { color: var(--text-mute); font-size: 0.82rem; font-weight: 400; }

    .avatar-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 2px solid var(--line);
      padding: 0;
      cursor: pointer;
      overflow: hidden;
      background: var(--surface);
      transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      flex: none;
    }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .avatar-btn.is-authed { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(52, 214, 165, 0.18); }

    /* ---- Screens (non-scroll, cross-fade) ---- */
    .screen {
      position: fixed; inset: 0;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .screen.is-active { opacity: 1; visibility: visible; pointer-events: auto; }
    @media (prefers-reduced-motion: reduce) { .screen { transition-duration: 0.01ms; } }

    .map-wrap { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

    /* ---- Map card (fills the screen) ---- */
    .map-card {
      flex: 1 1 auto; min-height: 0;
      margin: 8px 0 0;
      background: transparent;   /* sea = page background, so only the land shows */
      overflow: hidden;
    }
    #map { width: 100%; height: 100%; }

    /* ---- Discover button ---- */
    .discover-wrap { flex: none; display: flex; justify-content: center; padding: 14px 0 20px; }
    .discover-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 22px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      font: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }
    .discover-btn:hover {
      border-color: var(--accent); color: var(--accent);
      transform: translateY(-1px); box-shadow: 0 0 0 3px rgba(52, 214, 165, 0.14);
    }
    .discover-btn span { color: var(--accent); }

    /* ---- Sites screen (shared network footer, full screen) ---- */
    .screen-sites {
      display: flex; flex-direction: column;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(91, 140, 255, 0.10), transparent 60%),
        radial-gradient(900px 500px at 0% 110%, rgba(52, 214, 165, 0.08), transparent 55%),
        var(--bg);
    }
    .sites-bar {
      flex: none; width: 100%; max-width: 1120px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 16px 20px;
    }
    .sites-crumb { color: var(--text-mute); font-size: 0.85rem; }
    .sites-crumb .sites-sub { color: var(--text-dim); font-weight: 600; }
    .sites-back {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 16px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }
    .sites-back:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
    /* flex spacers center the network block vertically, yet let it scroll when it overflows */
    .sites-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
    .sites-body::before, .sites-body::after { content: ""; flex: 1 1 auto; }
    .sites-idle {
      text-align: center; color: var(--text-mute);
      font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;
      margin: 8px 0 26px;
    }

    /* ---- jsVectorMap tooltip skin ---- */
    .jvm-tooltip {
      background: var(--surface-2) !important;
      color: var(--text) !important;
      border: 1px solid var(--line) !important;
      border-radius: 8px !important;
      padding: 7px 11px !important;
      font-family: inherit !important;
      font-size: 0.85rem !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5) !important;
    }
    .jvm-tooltip .t-name { font-weight: 600; }
    .jvm-tooltip .t-visits { color: var(--accent); }
    .jvm-tooltip .t-none { color: var(--text-mute); }
    .jvm-container { background: transparent !important; }

    /* ---- Footer ---- */
    footer {
      padding: 26px 0 40px;
      color: var(--text-mute);
      font-size: 0.84rem;
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    footer a { color: var(--text-dim); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    /* ---- Login modal ---- */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(5, 7, 12, 0.66);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center; justify-content: center;
      padding: 20px; z-index: 50;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 100%; max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 24px 22px;
      animation: pop 0.16s ease-out;
    }
    @keyframes pop { from { transform: translateY(8px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal h2 { margin: 0 0 4px; font-size: 1.2rem; }
    .modal .lede { margin: 0 0 18px; color: var(--text-mute); font-size: 0.86rem; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 11px 12px;
      background: var(--bg-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px;
      font-size: 0.95rem; outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(91,140,255,0.18); }
    .modal .msg { min-height: 18px; font-size: 0.82rem; margin: 2px 0 12px; }
    .modal .msg.err { color: var(--danger); }
    .modal .msg.ok { color: var(--accent); }
    .btn {
      width: 100%; padding: 12px;
      border: none; border-radius: 10px;
      background: linear-gradient(92deg, var(--accent), var(--accent-2));
      color: var(--on-accent); font-weight: 700; font-size: 0.95rem;
      cursor: pointer; transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.6; cursor: default; transform: none; }
    .modal .close {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none; color: var(--text-mute);
      font-size: 1.4rem; cursor: pointer; line-height: 1;
    }
    .modal-shell { position: relative; }
    .modal .hintline { margin: 14px 0 0; font-size: 0.76rem; color: var(--text-mute); text-align: center; }
  </style>
</head>
<body>
  <!-- Screen 1 · travel map (landing) -->
  <section class="screen screen-map is-active" id="screenMap" aria-hidden="false">
    <div class="wrap map-wrap">
      <header>
        <h1 class="app-title">Everywhere I've <span class="grad">been</span>.</h1>
        <button class="avatar-btn" id="avatarBtn" title="Sign in" aria-label="Sign in">
          <img src="profile.jpg" alt="Sankha Cooray" />
        </button>
      </header>

      <div class="map-card">
        <div id="map"></div>
      </div>

      <div class="discover-wrap">
        <button class="discover-btn" id="discoverBtn">Discover Sankha <span aria-hidden="true">&rarr;</span></button>
      </div>
    </div>
  </section>

  <!-- Screen 2 · across the network (shared footer, full screen) -->
  <section class="screen screen-sites" id="screenSites" aria-hidden="true">
    <div class="sites-bar">
      <div class="sites-crumb">You were here · <span class="sites-sub">Travel map</span></div>
      <button class="sites-back" id="sitesBack" type="button">Back to travel <span aria-hidden="true">&#8617;</span></button>
    </div>
    <div class="sites-body">
      <!-- Shared network footer · cdn.sankhacooray.com (auto-themes to this page) -->
      <div id="scn-footer"></div>
      <p class="sites-idle">Returns to the map when idle</p>
    </div>
  </section>

  <script async src="https://cdn.sankhacooray.com/js/sankha-footer.js?v=20260625"
          data-site="travel.sankhacooray.com"></script>

  <!-- Login modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal modal-shell">
      <button class="close" id="modalClose" aria-label="Close">&times;</button>
      <h2>Welcome back</h2>
      <p class="lede">Private access — visa pack &amp; travel documents.</p>
      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="user">Username</label>
          <input type="text" id="user" name="user" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="pass">Password</label>
          <input type="password" id="pass" name="pass" autocomplete="current-password" required />
        </div>
        <div class="msg" id="loginMsg"></div>
        <button type="submit" class="btn" id="loginBtn">Sign in</button>
      </form>
      <p class="hintline">This area is for Sankha only.</p>
    </div>
  </div>

  <!-- Hidden form: POSTs token to the gate to open the server-rendered visa page (token never in URL) -->
  <form id="visaForm" method="POST" target="_blank" style="display:none">
    <input type="hidden" name="page" value="visa" />
    <input type="hidden" name="token" id="visaToken" />
  </form>

  <script src="vendor/jsvectormap.min.js"></script>
  <script src="vendor/world.js"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script>
  (function () {
    "use strict";

    var GATE_URL = (window.GATE_URL || "").trim();
    var isLocal = ["localhost", "127.0.0.1"].indexOf(location.hostname) !== -1;

    function cssVar(name, fallback) {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    }

    // ---- Colour ramp (jsVectorMap v1.6's series `scale` is an ordinal lookup,
    // value -> colour, NOT an interpolated gradient — so we precompute it). ----
    var RAMP_FROM = "#2f7d62"; // fewest visits (muted green, still clear on the dark sea)
    var RAMP_TO   = "#5ef0c2"; // most visits (bright mint — pops on dark)

    function hexToRgb(h) {
      h = h.replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    function lerpColor(a, b, t) {
      var ca = hexToRgb(a), cb = hexToRgb(b);
      var to2 = function (n) { return ("0" + Math.round(n).toString(16)).slice(-2); };
      return "#" + to2(ca[0] + (cb[0] - ca[0]) * t) +
                   to2(ca[1] + (cb[1] - ca[1]) * t) +
                   to2(ca[2] + (cb[2] - ca[2]) * t);
    }
    // value -> colour map across the distinct visit counts present.
    function buildScale(values) {
      var counts = Object.keys(values).map(function (c) { return values[c]; });
      var minV = Math.min.apply(null, counts), maxV = Math.max.apply(null, counts);
      var scale = {};
      counts.forEach(function (n) {
        var t = maxV === minV ? 0.85 : (n - minV) / (maxV - minV);
        t = Math.pow(t, 0.65); // boost mid-range so an outlier max doesn't wash everyone out
        scale[n] = lerpColor(RAMP_FROM, RAMP_TO, t);
      });
      return scale;
    }

    // ---------- Map ----------
    function normalize(raw) {
      // Accept { LK: {name, visits} } or { countries: { LK: {...} } }
      var c = raw && raw.countries ? raw.countries : raw;
      return c && typeof c === "object" ? c : {};
    }

    function buildMap(countries) {
      var values = {};
      var names = {};
      Object.keys(countries).forEach(function (code) {
        var v = Number(countries[code].visits) || 0;
        if (v <= 0) return;
        values[code] = v;
        names[code] = countries[code].name || code;
      });

      new jsVectorMap({
        selector: "#map",
        map: "world",
        zoomButtons: true,
        zoomOnScroll: false,
        backgroundColor: "transparent",
        regionStyle: {
          initial: {
            fill: cssVar("--map-empty", "#cdd6e6"),
            stroke: cssVar("--map-stroke", "#aab6cc"),
            strokeWidth: 0.5
          },
          hover: { stroke: cssVar("--text", "#e9ecf2"), strokeWidth: 1, cursor: "pointer" }
        },
        series: {
          regions: [{
            attribute: "fill",
            // light tint = fewer visits, deep teal = more visits ("darker = more").
            // scale is an ordinal value->colour map (see buildScale); values is code->count.
            scale: buildScale(values),
            values: values
          }]
        },
        onRegionTooltipShow: function (event, tooltip, code) {
          var name = names[code] || tooltip.text();
          var v = values[code];
          if (v) {
            tooltip.text('<span class="t-name">' + name + '</span> — <span class="t-visits">' + v + (v === 1 ? " visit" : " visits") + "</span>", true);
          } else {
            tooltip.text('<span class="t-name">' + tooltip.text() + '</span> <span class="t-none">— not visited yet</span>', true);
          }
        }
      });
    }

    // Baked data is fastest; on localhost fall back to the live gate so the map works pre-bake.
    if (typeof window.TRAVEL_DATA !== "undefined" && window.TRAVEL_DATA) {
      buildMap(normalize(window.TRAVEL_DATA));
    } else if (isLocal && GATE_URL) {
      fetch(GATE_URL + "?action=mapdata")
        .then(function (r) { return r.json(); })
        .then(function (j) { buildMap(normalize(j)); })
        .catch(function () { buildMap({}); });
    } else {
      buildMap({});
    }

    // ---------- Login ----------
    var overlay = document.getElementById("modalOverlay");
    var avatarBtn = document.getElementById("avatarBtn");
    var closeBtn = document.getElementById("modalClose");
    var form = document.getElementById("loginForm");
    var msg = document.getElementById("loginMsg");
    var loginBtn = document.getElementById("loginBtn");

    function openVisa(token) {
      var f = document.getElementById("visaForm");
      document.getElementById("visaToken").value = token;
      f.action = GATE_URL;
      f.submit();
    }

    function setMsg(text, kind) {
      msg.textContent = text || "";
      msg.className = "msg" + (kind ? " " + kind : "");
    }

    avatarBtn.addEventListener("click", function () {
      // Already have a live session? Re-open the visa page straight away.
      var existing = sessionStorage.getItem("travelToken");
      if (existing) { openVisa(existing); return; }
      overlay.classList.add("open");
      setMsg("");
      setTimeout(function () { document.getElementById("user").focus(); }, 50);
    });

    function close() { overlay.classList.remove("open"); }
    closeBtn.addEventListener("click", close);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!GATE_URL) { setMsg("Sign-in isn't configured yet.", "err"); return; }
      var user = document.getElementById("user").value.trim();
      var pass = document.getElementById("pass").value;
      loginBtn.disabled = true;
      setMsg("Checking…");

      fetch(GATE_URL, {
        method: "POST",
        // text/plain keeps it a "simple" request — no CORS preflight to the Apps Script web app.
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "login", user: user, pass: pass })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          loginBtn.disabled = false;
          if (res && res.ok && res.token) {
            sessionStorage.setItem("travelToken", res.token);
            avatarBtn.classList.add("is-authed");
            setMsg("Welcome back.", "ok");
            document.getElementById("pass").value = "";
            setTimeout(function () { close(); openVisa(res.token); }, 400);
          } else {
            setMsg((res && res.message) || "Incorrect username or password.", "err");
          }
        })
        .catch(function () {
          loginBtn.disabled = false;
          setMsg("Couldn't reach the server. Try again.", "err");
        });
    });

    if (sessionStorage.getItem("travelToken")) avatarBtn.classList.add("is-authed");

    // ---------- Screen switching (map <-> sites), with idle auto-return ----------
    var screenMap = document.getElementById("screenMap");
    var screenSites = document.getElementById("screenSites");
    var discoverBtn = document.getElementById("discoverBtn");
    var sitesBack = document.getElementById("sitesBack");
    var IDLE_MS = 20000;
    var IDLE_EVENTS = ["mousemove", "mousedown", "keydown", "touchstart", "wheel", "click"];
    var idleTimer = null;

    function activate(el, on) {
      el.classList.toggle("is-active", on);
      el.setAttribute("aria-hidden", on ? "false" : "true");
    }
    function resetIdle() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(showMap, IDLE_MS);
    }
    function bindIdle(on) {
      IDLE_EVENTS.forEach(function (ev) {
        screenSites[(on ? "add" : "remove") + "EventListener"](ev, resetIdle, { passive: true });
      });
    }
    function showSites() {
      activate(screenMap, false);
      activate(screenSites, true);
      bindIdle(true);
      resetIdle();
    }
    function showMap() {
      clearTimeout(idleTimer);
      bindIdle(false);
      activate(screenSites, false);
      activate(screenMap, true);
    }

    discoverBtn.addEventListener("click", showSites);
    sitesBack.addEventListener("click", showMap);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && screenSites.classList.contains("is-active")) showMap();
    });

    // Register service worker (PWA / offline)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  })();
  </script>
<script async src="https://sankhacooray.com/js/sankha-analytics.js"></script>
</body>
</html>
